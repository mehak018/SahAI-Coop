services:
  # 1. AI RAG Engine Microservice
  - type: web
    name: sahai-ai-engine
    env: python
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001

  # 2. FastAPI Backend API
  - type: web
    name: sahai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AI_RAG_ENABLED
        value: "True"
      - key: AI_RAG_SERVICE_URL
        fromService:
          type: web
          name: sahai-ai-engine
          property: host
        transform: https://${host}/api/rag/query
      - key: AI_RAG_TIMEOUT_SECONDS
        value: "35"
      - key: CORS_ORIGINS
        value: '["*"]'
